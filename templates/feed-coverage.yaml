# =============================================================================
# THE FEED -> TOPIC COVERAGE MAP — which feeds are a source for which of the
# topic catalog's names. Authored 2026-08-03 WITH the NL-135 slate (product
# ruling Q1, DECISIONS 2026-08-02).
#
# WHAT THIS IS FOR. A reader picking topics at the Commissioning has no way to
# know whether her sources can serve them. On 2026-08-02 one picked nine health
# topics against a catalog with no health outlets and got a one-story edition
# with nothing said. This file is the data behind saying it. The state is
# computed LIVE at render (newslens.coverage) from this map plus the reader's
# own enabled sources, and is NEVER written into a profile — so approving a
# slate flips every reader's badges with no migration and no stale grades.
#
# THE ONE LAW: never fabricate abundance or coverage.
#   * ABSENCE is asserted with confidence, because a static map can PROVE it:
#     zero mapped feeds for a name means no source in the list has that beat.
#   * PRESENCE is only ever INCLUSION, never sufficiency: "4 sources cover this
#     area" is a fact about the list. It is not a promise of stories, and no
#     surface may render it as one. Mapped feeds != items != matches.
#
# THE CALIBRATION ASYMMETRY (why this map leans generous). Adding a name that
# a feed covers only sometimes weakens a claim we make weakly anyway. LEAVING
# a name off strengthens a claim we make confidently — and a confidently-wrong
# "no source covers this" over a list holding four world desks is exactly the
# fabrication this mechanism exists to prevent. So when in doubt, include.
#
# WHAT `covers` MEANS: the feed's REMIT routinely produces items there — its
# section, its desk, its beat. A general front page that mentions a subject
# during a big week is not a source for it. That rule is what reproduces the
# finding of record ("the org catalog carries ZERO health/science outlets")
# instead of laundering it away, and it is why the reader-facing absence line
# says a source covers something REGULARLY.
#
# TWO GRAINS, and the resolution rule (newslens.coverage.serving):
#   * A DOMAIN is served by feeds listing the domain, plus feeds listing any of
#     its topics.
#   * A TOPIC is served by feeds listing that topic. Only when NO feed lists it
#     does the topic inherit its domain's feeds. So a beat-level entry always
#     wins over inheritance — which is how the Systemic Risk credit topics
#     come out honestly headlines-only while the domain does not.
#
# EDITING RULES, enforced at load (coverage.CoverageError):
#   * Every name must exist in templates/topic-catalog.yaml. A typo would
#     silently un-cover a beat and nothing on screen would say so.
#   * Every fetchable feed in templates/profile-sources.yaml must appear here.
#     An unmapped feed makes absence unprovable, so the map's completeness is
#     a test, not a habit (tests/test_nl135_slate_land.py).
#   * `covers: []` is a real answer and is used deliberately below.
# =============================================================================

feeds:

  # --- Wire / record (reference_only: never fetched) --------------------------
  # Mapped truthfully, but they cannot serve coverage: coverage counts only
  # FETCHABLE sources, and these four are cited, never fetched. The policy
  # lives in code (coverage.state), not in bent data.
  - name: Associated Press
    covers: [Geopolitics, Middle East Conflict, Economic Policy]
  - name: Reuters
    covers: [Geopolitics, Global Trade, Economic Policy, Central Bank Policy]
  - name: The New York Times
    covers: [Geopolitics, Middle East Conflict, Economic Policy]
  - name: Wikipedia
    covers: []
    note: "a reference work, not a news feed — it has no beat"

  # --- Paywalled majors -------------------------------------------------------
