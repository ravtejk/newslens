    covers: [Central Bank Policy, Economic Policy, Global Trade, East Asia,
             Europe, Systemic Risk, Private Credit, Direct Lending,
             Shadow Banking, Credit Default Risk, Household Debt]
    note: "credit-market topics listed at BEAT level: Bloomberg runs a dedicated private-credit desk. It is headline_only, which is the point of the disclosure — see the Systemic Risk finding, NL-135 research §3.5"
  - name: Bloomberg Politics
    covers: [Economic Policy, Geopolitics, US Legislative Process]
