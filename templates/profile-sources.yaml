# =============================================================================
# NewsLens PROFILE TEMPLATE — the source catalog a new profile is born with.
#
# GENERATED at Stage-0 M1 (2026-07-25) from the COMMITTED sources.yaml at
# fa26e45 — never from the principal's working copy, which carries his own
# uncommitted tuning. `newslens profile create <name>` copies this file to
# profiles/<name>/sources.yaml. The founder's own sources.yaml is NOT this
# file and is never read, written or moved by profile provisioning.
#
# THE INTERESTS BLOCK IS DELIBERATELY EMPTY. Interest tags are the strongest
# personalization signal in the system; inheriting another reader's tags is
# the same defect class as inheriting their memory threads (M0 finding F1),
# so a new profile starts with none. `newslens rank` refuses, by name, until
# the profile's reader has chosen their own — that refusal IS the Stage-0
# Commissioning's job, and per-profile interests move out of this file
# entirely in Stage-0 M2.
#
# NOBODY IS FOLLOWED HERE EITHER (Stage-0 M2, M1 gate rider). Three outlets
# below carry a `# followed_analyst: true` that is COMMENTED OUT. A followed
# analyst gets a personal-impact ranking boost independent of topic match —
# it is a statement about whose writing THIS reader has decided to follow, and
# the three in question (Tooze, Smith, Yglesias) are the founder's follows.
# Shipping them live meant every new profile was born reading his people. The
# OUTLETS stay in the catalog — they are good sources and a reader can pick
# them; the FOLLOW is a choice, and choices are not inherited.
#   To follow one: uncomment its `followed_analyst: true` line. That is the
#   whole reversal, one line per source.
#
# Everything below the header, down to `interests:`, is the ORG SOURCE
# CATALOG verbatim apart from those three commented lines. It drifts from
# sources.yaml only when the catalog is edited; test_stage0_m1_profiles.py
# pins that this file still parses clean with active sources and zero
# interests, and tests/test_stage0_m2.py pins the zero-follows posture.
# =============================================================================

# =============================================================================
# NewsLens sources & interests — this file is yours to edit.
#
# SEEDED 2026-07-03 from the principal's outlet list (M2 dispatch). Every
# rss_url below was live-verified on 2026-07-03 with the pipeline's own
# User-Agent; outlets with no usable feed are recorded as comments with the
# reason, at the bottom of the sources block. Run `scripts/doctor` after any
# edit — it validates format and re-checks that enabled feeds resolve.
#
# Fields per source:
#   name: <outlet>            required — used in attribution + corroboration
#   rss_url: <feed URL>       required unless tier: reference_only
#   tier: full | headline_only | cautious | reference_only   (default: full)
#     full           usable RSS content (title + summary)
#     headline_only  paywalled: titles/summaries only; attribution + linkout
#     cautious       aggregator: DEFAULT-DISABLED; if enabled, flagged and
#                    down-weighted downstream
#     reference_only citable in briefings, NEVER fetched
#   enabled: true|false       default true (cautious tier defaults to false)
#   wire_syndication: true    wire services AND heavy wire-republishers, so
#                             corroboration counting can exclude them — five
#                             outlets running the same wire copy is ONE source
#   note: "..."               free-text context, surfaced in reports
# =============================================================================

# --- Settings ------------------------------------------------------------------
# These two values are DECIDED for a new profile (Stage-0 M2), not inherited:
# both are what a reader who has chosen nothing yet should get.
#
# threads_steer_selection (A6, principal editorial review 2026-07-05):
# false = briefings-of-record select on interest tags + world impact only;
# your live threads are still matched, recorded, and woven into continuity —
# they just don't boost what gets picked. Flip to true to restore steering.
settings:
  threads_steer_selection: false
  # tts_engine: which voice reads the briefing — kokoro (local, free) or
  # openai (gpt-4o-mini-tts, ~$0.015/min on your OpenAI key). A new profile
  # starts on the $0 LOCAL voice deliberately: nobody should start spending
  # on audio they have not chosen to spend on. Flipping is editing this line.
  # (Note this differs from the package default in config.py, which is the
  # principal's own ear-test ruling for HIS install, 2026-07-06.)
  tts_engine: kokoro

sources:
  # --- Wire / major (reference_only per principal: referenced, not fetched) --
  - name: Associated Press
    tier: reference_only
    wire_syndication: true
    note: "public RSS discontinued by AP; wire copy reaches us via other feeds"
  - name: Reuters
    tier: reference_only
    wire_syndication: true
    note: "public RSS discontinued 2020; wire copy reaches us via other feeds"
  - name: The New York Times
    tier: reference_only
    note: "principal: reference/linkout only — NYT RSS exists and was verified live (rss.nytimes.com) if this ever changes"
  - name: Wikipedia
    tier: reference_only
    note: "principal: requires primary-source verification; NEVER counts as corroboration"

  # --- Paywalled majors (headline_only: titles + summaries, linkout) --------
  - name: Bloomberg Markets
    rss_url: https://feeds.bloomberg.com/markets/news.rss
    tier: headline_only
    wire_syndication: true
    note: "Bloomberg syndicates widely (incl. BNN Bloomberg) — wire-flagged"
