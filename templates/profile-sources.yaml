# --- Interests ---------------------------------------------------------------
# EMPTY BY DESIGN (see the header). Fill these in with THIS reader's tags:
#   broad:     domain-level tags — HALF personal-impact weight
#   granular:  topic-level tags — FULL personal-impact weight
# `newslens rank` refuses while both are empty, naming this file. Add them by
# hand here, or through the served UI's interest editor.
#
# BARE KEYS, not `[]`: this is the exact shape the UI's own editor leaves
# behind when you remove your last interest, so the add-an-interest door
# round-trips through it. (An M1 draft shipped `broad: []` and shut that door
# — the editor appends a block-sequence item, which is invalid YAML under a
# flow list. QA fix loop 1, F3.)
interests:
  broad:          # domain-level (half-weight personalization signal)
  granular:       # topic-level (full-weight personalization signal)
