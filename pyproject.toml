[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "newslens"
version = "0.1.0"  # version bumps ride with QA's suite updates, not mid-loop
description = "NewsLens — memory-threaded daily news briefing with audio (personal prototype)"
readme = "README.md"
requires-python = ">=3.9"  # floor matches the principal's machine (system Python 3.9.6)
dependencies = [
    "pyyaml>=6.0",        # parses sources.yaml (outlets + interests)
    "python-dotenv>=1.0", # loads .env (principal-filled keys)
    "feedparser>=6.0",    # RSS/Atom/RDF parsing (M2 ingestion) — new dep, escalation-listed
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",        # QA-owned test suite (tests/)
    # NL-163 Stage-A M2 (2026-08-29) — a DEV dependency, not a runtime one.
    # The hosted reader (hosted/) is a separate deployable with its own
    # requirements.txt; the product package still imports nothing but the three
    # runtime deps above, and nothing in src/newslens imports flask. It is
    # listed here because the hosted service's tests are part of this ONE
    # suite: tests/test_nl163_hosted.py importorskips flask so a dev without it
    # still runs green, and a suite that skips those nodes on every machine
    # would be enforcement-dead. `pip install -e '.[dev]'` is how a dev gets it.
    "flask>=3.0",
]

[project.scripts]
newslens = "newslens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NL-126b third-leg convention (ENGINEERING.md, gate ruling R3 2026-07-31).
# `-p` and NOT a conftest re-export: tests/conftest.py imports newslens twelve
# lines before its re-export point, so a configure-time clock swap is already
# too late (measured: newslens.{db,paths} are in sys.modules at pytest_configure
# and absent at -p import). `pythonpath` puts the repo root on sys.path BEFORE
# plugin loading, which is what makes `tools.` importable under the `pytest`
# console script as well as `python -m pytest`. The plugin is inert unless
# --clockshift / NEWSLENS_CLOCKSHIFT asks for a horizon.
pythonpath = ["."]
addopts = "-p tools.pytest_clockshift"
